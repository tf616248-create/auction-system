<div class="container">
  <button mat-button routerLink="/">← חזרה לרשימה</button>

  <div *ngIf="isLoading" class="spinner-wrapper">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && auction">
    <mat-card class="auction-card">
      <mat-card-header>
        <mat-card-title>{{ auction.title }}</mat-card-title>
        <mat-card-subtitle>{{ auction.description }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="info-row">
          <span>מחיר נוכחי:</span>
          <strong class="price">₪{{ auction.currentPrice }}</strong>
        </div>
        <div class="info-row">
          <span>זמן שנותר:</span>
          <strong>{{ formatTime(auction.timeRemainingSeconds) }}</strong>
        </div>
        <div class="info-row">
          <span>סטטוס:</span>
          <strong
            [class]="
              auction.status === 'Active' ? 'status-active' : 'status-closed'
            "
          >
            {{ auction.status === "Active" ? "פעילה" : "נסגרה" }}
          </strong>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="bid-card" *ngIf="auction.status === 'Active'">
      <mat-card-header>
        <mat-card-title>הגש הצעת מחיר</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="bidForm">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>שם המציע</mat-label>
            <input matInput formControlName="bidderName" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label
              >סכום (מינימום ₪{{ auction.currentPrice + 1 }})</mat-label
            >
            <input matInput type="number" formControlName="amount" />
          </mat-form-field>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-raised-button
          color="primary"
          (click)="placeBid()"
          [disabled]="bidForm.invalid || isSubmitting"
        >
          {{ isSubmitting ? "שולח..." : "הגש הצעה" }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
